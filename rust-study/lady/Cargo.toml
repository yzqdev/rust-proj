[workspace]
resolver = "2"
members = [
    "phoebe",
    "pela",
    "httpman",
    "asta",
    "robin",
    "sampo",
    "taoqi",
    "hash-utils",
]

[workspace.package]
edition = "2024"
authors = ["yzqdev"]
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5.30", features = ["derive", "cargo"] }
clap_complete = "4.5.30"
anyhow = "1.0.80"
thiserror = "2.0.0"
serde_json = "1.0"
csv = "1.3"
colored = "3.0.0"
md-5 = "0.10.1"
sha2 = "0.10.8"
digest = "0.10.3"
jsonxf = "1.1.1"
mime = "0.3.17"
reqwest = { version = "0.12.12", features = ["json"] }
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread", "macros"] }
# dev-dependencies
assert_cmd = "2.0.0"
predicates = "3.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "thin"
